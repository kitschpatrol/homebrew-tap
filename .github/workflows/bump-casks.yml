name: Bump Homebrew Casks
on:
  schedule:
    # Runs at 07:00 UTC every day.
    - cron: '0 7 * * *'
  workflow_dispatch: {}

jobs:
  bump-homebrew-casks:
    runs-on: macos-latest
    steps:
      # Tapping evaluates formulae too, so trust the tap before the action runs.
      - name: Trust tap
        run: brew trust kitschpatrol/tap
      - name: Bump casks
        uses: kitschpatrol/github-action-homebrew-bump-cask@590cca07222e4ee70d9cad0e049646800fdda9ca # v3.8.11
        with:
          tap: kitschpatrol/tap # Bump all outdated casks in this tap
          token: ${{secrets.PERSONAL_ACCESS_TOKEN}} # Required, custom GitHub access token with only the 'public_repo' scope enabled
          livecheck: true # Need to set this input if want to use `brew livecheck`
      - name: Verify mirror release detection
        run: |
          brew livecheck --cask --json \
            kitschpatrol/tap/easy-complete-mirror \
            kitschpatrol/tap/hex-mirror \
            kitschpatrol/tap/font-sf-mono-nerd-font-mirror > "$RUNNER_TEMP/mirror-livecheck.json"
          cat "$RUNNER_TEMP/mirror-livecheck.json"
          brew ruby -- -rjson -e '
            results = JSON.parse(File.read(ARGV.fetch(0)))
            abort "A mirrored cask release check failed" unless results.length == 3 &&
              results.all? { |result| result.dig("version", "latest").is_a?(String) }
          ' "$RUNNER_TEMP/mirror-livecheck.json"

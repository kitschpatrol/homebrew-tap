name: Bump Homebrew Formulas
on:
  schedule:
    # Runs at 2 AM EST±DST every day
    - cron: '0 7 * * *'
  workflow_dispatch: {}

jobs:
  bump-homebrew-formulas:
    runs-on: macos-latest
    steps:
      # Tapping evaluates formulae, so trust the tap before the action runs.
      - name: Trust tap
        run: brew trust kitschpatrol/tap
      - name: Bump formulas
        uses: kitschpatrol/github-action-homebrew-bump-formula@888455302af65093263284cb63333f62c3ab3169 # v8.0.0
        with:
          tap: kitschpatrol/tap
          token: ${{secrets.PERSONAL_ACCESS_TOKEN}}
          livecheck: true

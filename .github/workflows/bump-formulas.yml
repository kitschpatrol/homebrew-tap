name: Bump Homebrew Formulas
on:
  schedule:
    # Runs at 07:00 UTC every day.
    - cron: '0 7 * * *'
  workflow_dispatch: {}

jobs:
  check-formula-mirrors:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      updates: ${{ steps.check.outputs.updates }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test mirror adaptations
        run: node --test scripts/sync-mirrors.test.ts
      - name: Find outdated formula mirrors
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          updates="$(node scripts/sync-mirrors.ts --json)"
          echo "$updates"
          echo "updates=$updates" >> "$GITHUB_OUTPUT"

  sync-formula-mirrors:
    needs: check-formula-mirrors
    if: needs.check-formula-mirrors.outputs.updates != '[]'
    name: ${{ matrix.name }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.check-formula-mirrors.outputs.updates) }}
    concurrency: sync-${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Sync upstream formula recipes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-mirrors.ts --write
      - name: Open or update mirror PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          branch: bump-${{ matrix.name }}-${{ matrix.version }}
          delete-branch: true
          add-paths: Formula/${{ matrix.name }}.rb
          commit-message: ${{ matrix.name }} ${{ matrix.version }}
          title: ${{ matrix.name }} ${{ matrix.version }}
          body: |
            Synced from the upstream recipe at ${{ matrix.source }},
            retaining the adaptations in `scripts/mirrors/${{ matrix.name }}.patch`.

            ---

            Created with `scripts/sync-mirrors.ts`.

  bump-homebrew-formulas:
    runs-on: macos-latest
    steps:
      # Tapping evaluates formulae, so trust the tap before the action runs.
      - name: Trust tap
        run: brew trust kitschpatrol/tap
      - name: Bump formulas
        uses: kitschpatrol/github-action-homebrew-bump-formula@30a305757def31c9d2f48d4ecba395b87ddfe8ee # v10.0.2
        with:
          tap: kitschpatrol/tap
          token: ${{secrets.PERSONAL_ACCESS_TOKEN}}
          livecheck: true
      - name: Verify Brew-file release detection
        run: |
          brew livecheck --formula --json kitschpatrol/tap/brew-file-mirror > "$RUNNER_TEMP/mirror-livecheck.json"
          cat "$RUNNER_TEMP/mirror-livecheck.json"
          brew ruby -- -rjson -e '
            results = JSON.parse(File.read(ARGV.fetch(0)))
            abort "The Brew-file release check failed" unless results.length == 1 &&
              results.all? { |result| result.dig("version", "latest").is_a?(String) }
          ' "$RUNNER_TEMP/mirror-livecheck.json"

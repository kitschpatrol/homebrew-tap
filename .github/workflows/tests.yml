name: brew test-bot

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  mirror-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test scripts/*.test.ts

  test-bot:
    strategy:
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # test-bot resolves every `conflicts_with` formula before installing and
      # fails when a cross-tap conflict's tap is missing or untrusted. Formula
      # mirrors conflict with their upstream formulae, so tap those upstreams.
      - name: Tap the formula mirrors' upstream taps
        if: github.event_name == 'pull_request'
        run: |
          upstream_taps="$(jq --raw-output \
            'to_entries[] | select(.key | startswith("formula/")) | .value.upstreamTap // empty' \
            "$(brew --repository kitschpatrol/tap)/tap_metadata.json" | sort --unique)"
          for tap in $upstream_taps; do
            brew trust --taps "$tap"
            brew tap "$tap"
          done

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
